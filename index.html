<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Galeria RV - Computação Gráfica</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      #hud-rv {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.88);
        color: #f8fafc;
        padding: 10px 18px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 13px;
        z-index: 10;
        text-align: center;
        pointer-events: none;
        width: 88%;
        max-width: 420px;
        border: 1px solid #334155;
      }
      #btn-voltar {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(30, 41, 59, 0.9);
        color: white;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: bold;
        z-index: 10;
        border: 1px solid #475569;
      }
    </style>
  </head>

  <body>
    <div id="hud-rv">
      <strong>Galeria RV:</strong> Gire o celular para olhar 360°. Fixe o cursor verde nos
      <strong>sólidos</strong> ou nos <strong>discos do chão</strong> (teleporte).
    </div>

    <a id="btn-voltar" href="index.html">← Menu</a>

    <a-scene renderer="antialias: true; colorManagement: true;">
      <!-- Céu em gradiente / atmosfera noturna -->
      <a-sky color="#090d16"></a-sky>

      <!-- Rig do Jogador (permite teleporte mudando a posição deste container) -->
      <a-entity id="rig-jogador" position="0 0 2">
        <a-camera position="0 1.6 0" look-controls="magicWindowTrackingEnabled: true" wasd-controls>
          <!-- Cursor central com Raycasting (ativa em 1.5s) -->
          <a-cursor
            fuse="true"
            fuse-timeout="1500"
            color="#22c55e"
            geometry="primitive: ring; radiusInner: 0.014; radiusOuter: 0.024"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.25 0.25 0.25"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 200; to: 1 1 1"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.25 0.25 0.25; to: 1 1 1"
          ></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Iluminação da Galeria -->
      <a-light type="ambient" color="#94a3b8" intensity="0.65"></a-light>
      <a-light type="directional" position="3 6 4" intensity="0.85" color="#ffffff"></a-light>
      <a-light type="point" position="0 3.5 -3" intensity="0.9" color="#38bdf8" distance="12"></a-light>

      <!-- Piso e Grade de Referência Espacial -->
      <a-plane position="0 0 -2" rotation="-90 0 0" width="14" height="14" material="color: #0f172a; roughness: 0.85;"></a-plane>
      <a-grid-helper position="0 0.01 -2" size="14" divisions="14" color-center-line="#1e293b" color-grid="#1e293b"></a-grid-helper>

      <!-- Paredes Baixas da Galeria (criam sensação de recinto fechado em 360°) -->
      <a-box position="0 1.5 -9" width="14" height="3" depth="0.2" material="color: #1e293b; roughness: 0.9;"></a-box>
      <a-box position="-7 1.5 -2" width="0.2" height="3" depth="14" material="color: #1e293b; roughness: 0.9;"></a-box>
      <a-box position="7 1.5 -2" width="0.2" height="3" depth="14" material="color: #1e293b; roughness: 0.9;"></a-box>
      <a-box position="0 1.5 5" width="14" height="3" depth="0.2" material="color: #1e293b; roughness: 0.9;"></a-box>

      <!-- Painel Título na Parede Frontal -->
      <a-entity position="0 2.3 -8.85">
        <a-text value="LABORATORIO DE COMPUTACAO GRAFICA" align="center" color="#38bdf8" width="7"></a-text>
        <a-text value="Olhe para os solidos para aplicar Transformacoes 3D" position="0 -0.35 0" align="center" color="#cbd5e1" width="4.5"></a-text>
      </a-entity>

      <!-- ESTAÇÃO 1 (Esquerda): ROTAÇÃO -->
      <a-entity position="-3 0 -4">
        <!-- Pedestal -->
        <a-cylinder position="0 0.5 0" radius="0.55" height="1" material="color: #334155;"></a-cylinder>
        <!-- Cubo Interativo -->
        <a-box
          position="0 1.65 0"
          width="0.85"
          height="0.85"
          depth="0.85"
          material="color: #3b82f6; roughness: 0.5;"
          animation="property: rotation; to: 360 360 0; dur: 2000; easing: easeInOutQuad; startEvents: click"
        ></a-box>
        <a-text value="1. ROTACAO (360°)" position="0 0.7 0.58" align="center" color="#ffffff" width="2.6"></a-text>
      </a-entity>

      <!-- ESTAÇÃO 2 (Centro): ESCALA -->
      <a-entity position="0 0 -5">
        <a-cylinder position="0 0.5 0" radius="0.55" height="1" material="color: #334155;"></a-cylinder>
        <!-- Toroide Interativo -->
        <a-torus
          position="0 1.7 0"
          radius="0.48"
          radius-tubular="0.16"
          material="color: #10b981; roughness: 0.5;"
          animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: 2; dur: 650; startEvents: click"
        ></a-torus>
        <a-text value="2. ESCALA (1.5x)" position="0 0.7 0.58" align="center" color="#ffffff" width="2.6"></a-text>
      </a-entity>

      <!-- ESTAÇÃO 3 (Direita): TRANSLAÇÃO -->
      <a-entity position="3 0 -4">
        <a-cylinder position="0 0.5 0" radius="0.55" height="1" material="color: #334155;"></a-cylinder>
        <!-- Icosaedro Interativo -->
        <a-icosahedron
          position="0 1.65 0"
          radius="0.55"
          material="color: #f59e0b; roughness: 0.5;"
          animation="property: position; from: 0 1.65 0; to: 0 2.55 0; dir: alternate; loop: 2; dur: 550; startEvents: click"
        ></a-icosahedron>
        <a-text value="3. TRANSLACAO (+Y)" position="0 0.7 0.58" align="center" color="#ffffff" width="2.6"></a-text>
      </a-entity>

      <!-- PONTOS DE TELEPORTE NO CHÃO (olhe por 1.5s para mover a câmera até o ponto) -->
      <a-ring
        class="teleporte"
        data-destino="-2.2 0 -1.8"
        position="-2.2 0.03 -1.8"
        rotation="-90 0 0"
        radius-inner="0.25"
        radius-outer="0.4"
        color="#38bdf8"
      ></a-ring>

      <a-ring
        class="teleporte"
        data-destino="0 0 -2.5"
        position="0 0.03 -2.5"
        rotation="-90 0 0"
        radius-inner="0.25"
        radius-outer="0.4"
        color="#38bdf8"
      ></a-ring>

      <a-ring
        class="teleporte"
        data-destino="2.2 0 -1.8"
        position="2.2 0.03 -1.8"
        rotation="-90 0 0"
        radius-inner="0.25"
        radius-outer="0.4"
        color="#38bdf8"
      ></a-ring>

      <a-ring
        class="teleporte"
        data-destino="0 0 2"
        position="0 0.03 2"
        rotation="-90 0 0"
        radius-inner="0.25"
        radius-outer="0.4"
        color="#94a3b8"
      ></a-ring>
    </a-scene>

    <script>
      // Lógica de locomoção por teleporte ao fixar o olhar nos anéis do chão
      document.querySelectorAll(".teleporte").forEach((anel) => {
        anel.addEventListener("click", () => {
          const destino = anel.getAttribute("data-destino");
          const rig = document.getElementById("rig-jogador");
          rig.setAttribute("position", destino);
        });
      });
    </script>
  </body>
</html>
