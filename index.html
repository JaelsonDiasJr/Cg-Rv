<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Galeria RV - Computação Gráfica</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      #hud-rv {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(8, 13, 24, 0.82);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #e2e8f0;
        padding: 10px 18px 12px;
        border-radius: 16px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        z-index: 10;
        text-align: center;
        pointer-events: none;
        width: 88%;
        max-width: 440px;
        border: 1px solid #1e3a5f;
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
      }
      #hud-rv strong { color: #67e8f9; }
      #hud-info {
        display: block;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #1e3a5f;
        color: #fbbf24;
        font-weight: 600;
        min-height: 18px;
      }
      #btn-voltar {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(8, 13, 24, 0.85);
        color: #e2e8f0;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        z-index: 10;
        border: 1px solid #1e3a5f;
      }
      #btn-voltar:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
    </style>
  </head>

  <body>
    <div id="hud-rv">
      Gire o celular para olhar ao redor. Mire o <strong>cursor</strong> em um objeto por 1,5 s para
      transformá-lo, ou nos <strong>anéis do chão</strong> para se teletransportar.
    </div>

    <a id="btn-voltar" href="index.html">← Menu</a>

    <a-scene renderer="antialias: true; colorManagement: true;">
      <a-sky color="#070b14"></a-sky>
      <a-entity estrelas></a-entity>

      <!-- Rig do jogador (teleporte move este container) -->
      <a-entity id="rig-jogador" position="0 0 2">
        <a-camera position="0 1.6 0" look-controls="magicWindowTrackingEnabled: true" wasd-controls>
          <a-cursor
            fuse="true"
            fuse-timeout="1500"
            color="#67e8f9"
            geometry="primitive: ring; radiusInner: 0.014; radiusOuter: 0.024"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.25 0.25 0.25"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 200; to: 1 1 1"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.25 0.25 0.25; to: 1 1 1"
          ></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Iluminação (mantida idêntica ao seu index) -->
      <a-light type="hemisphere" color="#a5b4fc" groundColor="#0b1220" intensity="0.9"></a-light>
      <a-light type="directional" position="2 8 5" intensity="0.55" color="#ffffff"></a-light>
      <a-light type="point" position="-3.6 3 -3.5" intensity="0.9" color="#22d3ee" distance="8"></a-light>
      <a-light type="point" position="0 3 -4.5" intensity="0.9" color="#c084fc" distance="8"></a-light>
      <a-light type="point" position="3.6 3 -3.5" intensity="0.9" color="#fb923c" distance="8"></a-light>

      <!-- ========== NOVO AMBIENTE ARQUITETÔNICO ========== -->
      <a-circle position="0 0 -2.5" rotation="-90 0 0" radius="11" material="color: #0f172a; roughness: 0.7;"></a-circle>
      <a-ring position="0 0.01 -2.5" rotation="-90 0 0" radius-inner="5.8" radius-outer="5.95" color="#0284c7"></a-ring>
      <a-ring position="0 0.01 -2.5" rotation="-90 0 0" radius-inner="8.8" radius-outer="9.0" color="#1e3a8a"></a-ring>

      <!-- Cúpula Geodésica Wireframe no Teto -->
      <a-icosahedron
        position="0 1 -2.5"
        radius="10.5"
        detail="1"
        material="color: #1d4ed8; wireframe: true;"
      ></a-icosahedron>

      <!-- Colunas Arquitetônicas com Faixas Neon -->
      <a-entity position="-6.5 0 -6.5">
        <a-box position="0 2.2 0" width="0.5" height="4.4" depth="0.5" color="#1e293b"></a-box>
        <a-box position="0.26 2.2 0.26" width="0.06" height="4.2" depth="0.06" color="#38bdf8"></a-box>
      </a-entity>
      <a-entity position="6.5 0 -6.5">
        <a-box position="0 2.2 0" width="0.5" height="4.4" depth="0.5" color="#1e293b"></a-box>
        <a-box position="-0.26 2.2 0.26" width="0.06" height="4.2" depth="0.06" color="#38bdf8"></a-box>
      </a-entity>
      <a-entity position="-6.5 0 2.5">
        <a-box position="0 2.2 0" width="0.5" height="4.4" depth="0.5" color="#1e293b"></a-box>
        <a-box position="0.26 2.2 -0.26" width="0.06" height="4.2" depth="0.06" color="#38bdf8"></a-box>
      </a-entity>
      <a-entity position="6.5 0 2.5">
        <a-box position="0 2.2 0" width="0.5" height="4.4" depth="0.5" color="#1e293b"></a-box>
        <a-box position="-0.26 2.2 -0.26" width="0.06" height="4.2" depth="0.06" color="#38bdf8"></a-box>
      </a-entity>

      <!-- Letreiro Principal -->
      <a-entity position="0 3.7 -7.8">
        <a-plane width="6.8" height="1.15" color="#0f172a"></a-plane>
        <a-plane width="6.9" height="1.25" position="0 0 -0.01" color="#38bdf8"></a-plane>
        <a-text value="SHOWROOM DE COMPUTACAO GRAFICA" position="0 0.18 0.02" align="center" color="#f8fafc" width="6.2"></a-text>
        <a-text value="TRANSFORMACOES GEOMETRICAS 3D" position="0 -0.22 0.02" align="center" color="#38bdf8" width="4.4"></a-text>
      </a-entity>

      <!-- ========== ESTAÇÃO 1: ROBÔ (ROTAÇÃO) ========== -->
      <a-entity position="-3.9 0 -4.2" rotation="0 35 0">
        <a-entity class="estacao" data-info="Rotação: R(θ) em torno do eixo Y (0° → 360°)">
          <a-cylinder position="0 0.17 0" radius="0.85" height="0.35" material="color: #1e293b; metalness: 0.6; roughness: 0.35"></a-cylinder>
          <a-torus position="0 0.35 0" rotation="90 0 0" radius="0.85" radius-tubular="0.015" material="shader: flat; color: #22d3ee"></a-torus>

          <a-entity position="0 0.36 0" scale="0.95 0.95 0.95"
            animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2200; easing: easeInOutQuad; startEvents: click">
            <!-- pernas e pés -->
            <a-cylinder position="-0.14 0.28 0" radius="0.09" height="0.5" material="color: #cbd5e1; metalness: 0.7; roughness: 0.3"></a-cylinder>
            <a-cylinder position="0.14 0.28 0" radius="0.09" height="0.5" material="color: #cbd5e1; metalness: 0.7; roughness: 0.3"></a-cylinder>
            <a-box position="-0.14 0.04 0.05" width="0.22" height="0.08" depth="0.34" material="color: #475569; metalness: 0.5"></a-box>
            <a-box position="0.14 0.04 0.05" width="0.22" height="0.08" depth="0.34" material="color: #475569; metalness: 0.5"></a-box>
            <!-- quadril e tronco -->
            <a-box position="0 0.58 0" width="0.5" height="0.14" depth="0.28" material="color: #334155; metalness: 0.6"></a-box>
            <a-box position="0 0.93 0" width="0.58" height="0.56" depth="0.34" material="color: #e2e8f0; metalness: 0.6; roughness: 0.25"></a-box>
            <a-box position="0 1.0 0.175" width="0.24" height="0.16" depth="0.02" material="shader: flat; color: #22d3ee"></a-box>
            <a-box position="0 0.78 0.175" width="0.34" height="0.03" depth="0.02" material="color: #475569"></a-box>
            <!-- braços -->
            <a-sphere position="-0.38 1.1 0" radius="0.11" material="color: #475569; metalness: 0.7"></a-sphere>
            <a-sphere position="0.38 1.1 0" radius="0.11" material="color: #475569; metalness: 0.7"></a-sphere>
            <a-cylinder position="-0.4 0.84 0" radius="0.065" height="0.46" material="color: #e2e8f0; metalness: 0.7; roughness: 0.3"></a-cylinder>
            <a-cylinder position="0.4 0.84 0" radius="0.065" height="0.46" material="color: #e2e8f0; metalness: 0.7; roughness: 0.3"></a-cylinder>
            <a-sphere position="-0.4 0.58 0" radius="0.085" material="color: #22d3ee; metalness: 0.5"></a-sphere>
            <a-sphere position="0.4 0.58 0" radius="0.085" material="color: #22d3ee; metalness: 0.5"></a-sphere>
            <!-- cabeça -->
            <a-cylinder position="0 1.26 0" radius="0.06" height="0.1" material="color: #475569"></a-cylinder>
            <a-box position="0 1.48 0" width="0.44" height="0.34" depth="0.34" material="color: #f1f5f9; metalness: 0.5; roughness: 0.25"></a-box>
            <a-box position="0 1.5 0.172" width="0.36" height="0.15" depth="0.02" material="color: #0b1220; metalness: 0.9; roughness: 0.1"></a-box>
            <a-box position="-0.08 1.5 0.188" width="0.07" height="0.05" depth="0.01" material="shader: flat; color: #67e8f9"></a-box>
            <a-box position="0.08 1.5 0.188" width="0.07" height="0.05" depth="0.01" material="shader: flat; color: #67e8f9"></a-box>
            <a-cylinder position="-0.24 1.48 0" rotation="0 0 90" radius="0.07" height="0.05" material="shader: flat; color: #22d3ee"></a-cylinder>
            <a-cylinder position="0.24 1.48 0" rotation="0 0 90" radius="0.07" height="0.05" material="shader: flat; color: #22d3ee"></a-cylinder>
            <a-cylinder position="0 1.72 0" radius="0.012" height="0.16" material="color: #94a3b8"></a-cylinder>
            <a-sphere position="0 1.82 0" radius="0.04" material="shader: flat; color: #fbbf24"></a-sphere>
          </a-entity>
        </a-entity>

        <a-entity position="0 0.25 1.15" rotation="-35 0 0">
          <a-plane width="1.7" height="0.3" material="shader: flat; color: #0b1220; opacity: 0.88; transparent: true"></a-plane>
          <a-text value="ROBO  |  ROTACAO" position="0 0 0.01" align="center" color="#67e8f9" width="2.4"></a-text>
        </a-entity>
      </a-entity>

      <!-- ========== ESTAÇÃO 2: PLANETA (ESCALA) ========== -->
      <a-entity position="0 0 -5.8">
        <a-entity class="estacao" data-info="Escala: S(1,1,1) → S(1.5,1.5,1.5) e volta">
          <a-cylinder position="0 0.17 0" radius="0.85" height="0.35" material="color: #1e293b; metalness: 0.6; roughness: 0.35"></a-cylinder>
          <a-torus position="0 0.35 0" rotation="90 0 0" radius="0.85" radius-tubular="0.015" material="shader: flat; color: #c084fc"></a-torus>
          <a-cylinder position="0 1.0 0" radius="0.35" height="1.3" open-ended="true"
            material="shader: flat; color: #d8b4fe; opacity: 0.1; transparent: true; side: double"></a-cylinder>

          <a-entity position="0 1.9 0" rotation="0 0 -15"
            animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: 2; dur: 750; easing: easeInOutSine; startEvents: click">
            <a-sphere radius="0.52" material="color: #7c3aed; metalness: 0.3; roughness: 0.55"
              animation="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear"></a-sphere>
            <a-sphere radius="0.56" material="shader: flat; color: #c084fc; opacity: 0.18; transparent: true"></a-sphere>
            <a-ring rotation="-72 0 0" radius-inner="0.75" radius-outer="1.0" material="shader: flat; color: #f0abfc; opacity: 0.85; transparent: true; side: double"></a-ring>
            <a-ring rotation="-72 0 0" radius-inner="1.05" radius-outer="1.15" material="shader: flat; color: #e879f9; opacity: 0.5; transparent: true; side: double"></a-ring>
            <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 6000; loop: true; easing: linear">
              <a-sphere position="1.35 0.1 0" radius="0.1" material="color: #e2e8f0; roughness: 0.9"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>

        <a-entity position="0 0.25 1.15" rotation="-35 0 0">
          <a-plane width="1.7" height="0.3" material="shader: flat; color: #0b1220; opacity: 0.88; transparent: true"></a-plane>
          <a-text value="PLANETA  |  ESCALA" position="0 0 0.01" align="center" color="#d8b4fe" width="2.4"></a-text>
        </a-entity>
      </a-entity>

      <!-- ========== ESTAÇÃO 3: CARRO (TRANSLAÇÃO) ========== -->
      <a-entity position="4.6 0 -4.5" rotation="0 -37 0">
        <a-entity class="estacao" data-info="Translação: T(dx, 0, 0) — o carro anda no eixo X">
          <a-box position="0 0.03 0" width="3.5" height="0.06" depth="1.6" material="shader: flat; color: #fb923c"></a-box>
          <a-box position="0 0.1 0" width="3.4" height="0.1" depth="1.5" material="color: #1e293b; metalness: 0.6; roughness: 0.35"></a-box>

          <a-entity position="-0.8 0.15 0"
            animation="property: position; from: -0.8 0.15 0; to: 0.8 0.15 0; dir: alternate; loop: 2; dur: 1300; easing: easeInOutQuad; startEvents: click">
            <a-box position="0 0.33 0" width="1.9" height="0.3" depth="0.9" material="color: #dc2626; metalness: 0.75; roughness: 0.22"></a-box>
            <a-box position="0 0.486 0" width="1.88" height="0.01" depth="0.14" material="shader: flat; color: #f8fafc"></a-box>
            <a-box position="-0.1 0.7 0" width="0.9" height="0.28" depth="0.78" material="color: #0b1220; metalness: 1; roughness: 0.08; opacity: 0.92; transparent: true"></a-box>
            <a-box position="-0.1 0.855 0" width="0.72" height="0.05" depth="0.76" material="color: #b91c1c; metalness: 0.75; roughness: 0.22"></a-box>
            <a-box position="0.7 0.5 0" width="0.5" height="0.05" depth="0.86" rotation="0 0 -6" material="color: #dc2626; metalness: 0.75; roughness: 0.22"></a-box>
            <!-- rodas -->
            <a-cylinder position="0.62 0.21 0.48" rotation="90 0 0" radius="0.21" height="0.16" material="color: #0b0f19; roughness: 0.9"></a-cylinder>
            <a-cylinder position="-0.62 0.21 0.48" rotation="90 0 0" radius="0.21" height="0.16" material="color: #0b0f19; roughness: 0.9"></a-cylinder>
            <a-cylinder position="0.62 0.21 -0.48" rotation="90 0 0" radius="0.21" height="0.16" material="color: #0b0f19; roughness: 0.9"></a-cylinder>
            <a-cylinder position="-0.62 0.21 -0.48" rotation="90 0 0" radius="0.21" height="0.16" material="color: #0b0f19; roughness: 0.9"></a-cylinder>
            <a-cylinder position="0.62 0.21 0.565" rotation="90 0 0" radius="0.12" height="0.02" material="color: #e2e8f0; metalness: 1; roughness: 0.2"></a-cylinder>
            <a-cylinder position="-0.62 0.21 0.565" rotation="90 0 0" radius="0.12" height="0.02" material="color: #e2e8f0; metalness: 1; roughness: 0.2"></a-cylinder>
            <a-cylinder position="0.62 0.21 -0.565" rotation="90 0 0" radius="0.12" height="0.02" material="color: #e2e8f0; metalness: 1; roughness: 0.2"></a-cylinder>
            <a-cylinder position="-0.62 0.21 -0.565" rotation="90 0 0" radius="0.12" height="0.02" material="color: #e2e8f0; metalness: 1; roughness: 0.2"></a-cylinder>
            <!-- faróis, lanternas e aerofólio -->
            <a-sphere position="0.95 0.38 0.3" radius="0.07" scale="0.5 1 1" material="shader: flat; color: #fef3c7"></a-sphere>
            <a-sphere position="0.95 0.38 -0.3" radius="0.07" scale="0.5 1 1" material="shader: flat; color: #fef3c7"></a-sphere>
            <a-box position="-0.96 0.38 0.3" width="0.03" height="0.06" depth="0.2" material="shader: flat; color: #ef4444"></a-box>
            <a-box position="-0.96 0.38 -0.3" width="0.03" height="0.06" depth="0.2" material="shader: flat; color: #ef4444"></a-box>
            <a-box position="-0.9 0.68 0" width="0.14" height="0.04" depth="0.84" material="color: #0b1220; metalness: 0.6"></a-box>
            <a-box position="-0.9 0.6 0.3" width="0.04" height="0.14" depth="0.04" material="color: #0b1220"></a-box>
            <a-box position="-0.9 0.6 -0.3" width="0.04" height="0.14" depth="0.04" material="color: #0b1220"></a-box>
          </a-entity>
        </a-entity>

        <a-entity position="0 0.25 1.5" rotation="-35 0 0">
          <a-plane width="1.9" height="0.3" material="shader: flat; color: #0b1220; opacity: 0.88; transparent: true"></a-plane>
          <a-text value="CARRO  |  TRANSLACAO" position="0 0 0.01" align="center" color="#fdba74" width="2.6"></a-text>
        </a-entity>
      </a-entity>

      <!-- ========== PONTOS DE TELEPORTE ========== -->
      <a-entity class="teleporte" data-destino="-2.4 0 -2.2" position="-2.4 0.03 -2.2"></a-entity>
      <a-entity class="teleporte" data-destino="0 0 -3" position="0 0.03 -3"></a-entity>
      <a-entity class="teleporte" data-destino="2.4 0 -2.2" position="2.4 0.03 -2.2"></a-entity>
      <a-entity class="teleporte" data-destino="0 0 2" position="0 0.03 2" data-cor="#94a3b8"></a-entity>
    </a-scene>

    <script>
      // Estrelas no céu
      AFRAME.registerComponent("estrelas", {
        init() {
          const n = 700, pos = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) {
            const r = 70 + Math.random() * 20, a = Math.random() * Math.PI * 2, e = Math.random() * 1.3 + 0.1;
            pos[i * 3] = r * Math.cos(a) * Math.cos(e);
            pos[i * 3 + 1] = r * Math.sin(e);
            pos[i * 3 + 2] = r * Math.sin(a) * Math.cos(e);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          this.el.setObject3D("pontos", new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, fog: false })));
        },
      });

      // Anéis de teleporte (construídos por código)
      document.querySelectorAll(".teleporte").forEach((grupo) => {
        const cor = grupo.getAttribute("data-cor") || "#38bdf8";
        const anel = document.createElement("a-ring");
        anel.setAttribute("rotation", "-90 0 0");
        anel.setAttribute("radius-inner", "0.27");
        anel.setAttribute("radius-outer", "0.4");
        anel.setAttribute("material", `shader: flat; color: ${cor}; opacity: 0.85; transparent: true`);
        anel.setAttribute("animation", "property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine");
        const centro = document.createElement("a-circle");
        centro.setAttribute("rotation", "-90 0 0");
        centro.setAttribute("radius", "0.18");
        centro.setAttribute("material", `shader: flat; color: ${cor}; opacity: 0.25; transparent: true`);
        grupo.appendChild(anel);
        grupo.appendChild(centro);
        grupo.addEventListener("click", () => {
          document.getElementById("rig-jogador").setAttribute("position", grupo.getAttribute("data-destino"));
        });
      });
    </script>
  </body>
</html>
